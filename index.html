<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="referrer" content="no-referrer">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Media Viewer">

<title>Media Viewer - Night Edition V8</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    user-select: none;
    overflow-x: hidden;
    overscroll-behavior-y: none;
    scroll-behavior: smooth;
}

/* Header & Stats */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 6px;
    background: rgba(10, 10, 10, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    position: sticky;
    top: 0;
    z-index: 100;
}

.brand-title {
    font-size: 13px;
    font-weight: 700;
    color: #888;
    letter-spacing: 0.5px;
}

.mini-stats {
    display: flex;
    gap: 10px;
    font-size: 11px;
    color: #aaa;
}

.mini-stats span {
    color: #fff;
    font-weight: 600;
}

/* Search Bar */
.search-wrapper {
    padding: 8px 16px;
    background: #000;
}

#searchInput {
    width: 100%;
    padding: 10px 14px;
    font-size: 14px;
    background: #141414;
    border: 1px solid #222;
    border-radius: 12px;
    color: #fff;
    outline: none;
    transition: border-color 0.2s;
}

#searchInput:focus {
    border-color: #9333ea;
}

/* Media Display Area */
#mediaContainer {
    padding: 10px 0 160px;
    min-height: 80vh;
}

.media-container {
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    margin-bottom: 30px;
    touch-action: pan-y pinch-zoom;
}

.media-number {
    margin: 8px 0 2px;
    font-size: 13px;
    font-weight: 600;
    color: #777;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.seen-badge {
    background: rgba(16, 185, 129, 0.15);
    color: #10b981;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: normal;
}

/* Action Header Row (Heart & Save to Camera Roll) */
.media-actions-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 4px 0 6px;
}

/* Heart Button */
.heart-btn {
    border: none;
    background: transparent;
    color: #777;
    font-size: 26px;
    cursor: pointer;
    padding: 4px;
    transition: transform 0.15s ease, color 0.15s ease;
}

.heart-btn:active {
    transform: scale(1.2);
}

.heart-btn.active {
    color: #ff2d55;
}

/* Save to Camera Roll Button (One-Tap Direct) */
.save-camera-btn {
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: #38bdf8;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background 0.2s, transform 0.1s;
}

.save-camera-btn:active {
    transform: scale(0.95);
    background: rgba(56, 189, 248, 0.25);
}

.media-wrapper-inner {
    width: 100%;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: pan-x pan-y pinch-zoom;
}

.media-container img,
.media-container video {
    width: auto;
    max-width: 100vw;
    max-height: 63vh;
    height: auto;
    object-fit: contain;
    background: #050505;
    display: block;
    cursor: pointer;
    transition: transform 0.1s ease-out;
    -webkit-touch-callout: default !important;
}

.media-container a {
    width: 90%;
    margin: 6px 0;
    font-size: 10px;
    color: #444;
    word-break: break-all;
    text-decoration: none;
    transition: color 0.2s;
}
.media-container a:hover {
    color: #888;
}

/* Floating Double-Tap Heart Animation */
.floating-heart {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 100px;
    color: #ff2d55;
    pointer-events: none;
    z-index: 200;
    animation: popHeart 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.8));
}

@keyframes popHeart {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    40% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.35); opacity: 0; }
}

/* RIGHT-HAND THUMB DOCK (Optimized for One-Handed iPhone 11 Use) */
.thumb-dock {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 94%;
    max-width: 430px;
    background: rgba(18, 18, 22, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    z-index: 900;
}

.dock-btn {
    background: transparent;
    border: none;
    color: #ccc;
    font-size: 10px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 12px;
    transition: all 0.15s ease;
}

.dock-btn span.icon {
    font-size: 18px;
}

.dock-btn:active {
    transform: scale(0.9);
}

.dock-btn.heart-active {
    color: #ff2d55;
}

/* Primary Thumb Action Button (Rightmost / Easiest Thumb Reach) */
.dock-primary {
    background: linear-gradient(135deg, #9333ea, #c084fc);
    color: #fff;
    border: none;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    box-shadow: 0 4px 15px rgba(147, 51, 234, 0.5);
    cursor: pointer;
    transition: transform 0.15s ease;
}

.dock-primary:active {
    transform: scale(0.88);
}

/* History Modal & Settings Menu Modal */
#historyModal, #settingsModal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.96);
    z-index: 2000;
    padding: 20px;
    overflow-y: auto;
    text-align: left;
}
.history-item {
    display: flex;
    align-items: center;
    background: #121214;
    padding: 8px 12px;
    margin-bottom: 8px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
}
.history-item:hover {
    background: #1c1c1f;
}

/* Welcome / Status / Login */
#welcomeBanner {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 88%;
    max-width: 400px;
    background: #18181b;
    color: #fff;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 25px rgba(0,0,0,0.9);
    display: none;
    z-index: 2500;
    font-size: 13px;
}

#loginScreen {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#loginBox {
    background: #111;
    padding: 24px;
    border-radius: 16px;
    width: 88%;
    max-width: 340px;
    border: 1px solid #222;
}

#passwordInput {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    background: #18181b;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    outline: none;
}

.login-btn {
    width: 100%;
    padding: 12px;
    background: #9333ea;
    color: #fff;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 12px;
}

#app { display: none; }
.hidden { display: none !important; }
</style>
</head>

<body>

<div id="welcomeBanner">
    🌙 <b>Night Edition V8 Active</b><br><br>
    Right-handed ergonomics, one-tap photo saves, smooth swipe gestures, and secured settings menu.
</div>

<!-- History Modal -->
<div id="historyModal" class="hidden">
    <div style="max-width:450px; margin:0 auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #222; padding-bottom:12px;">
            <h3 style="margin:0; font-size:16px;">🕒 Recently Viewed History</h3>
            <button onclick="toggleHistoryModal()" style="background:#222; color:#fff; border:none; padding:6px 12px; border-radius:8px; cursor:pointer;">Close ✕</button>
        </div>
        <div id="historyListContainer"></div>
    </div>
</div>

<!-- Settings & Advanced Options Modal -->
<div id="settingsModal" class="hidden">
    <div style="max-width:400px; margin:40px auto; background:#121215; padding:20px; border-radius:16px; border:1px solid rgba(255,255,255,0.1);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #222; padding-bottom:10px;">
            <h3 style="margin:0; font-size:16px;">⚙️ Settings & Controls</h3>
            <button onclick="toggleSettingsModal()" style="background:#222; color:#fff; border:none; padding:6px 12px; border-radius:8px; cursor:pointer;">Close ✕</button>
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="font-size:12px; color:#aaa; display:block; margin-bottom:6px;">Auto-Play Speed</label>
            <select id="autoPlaySpeed" style="width:100%; background:#1c1c21; color:#fff; border:1px solid #333; border-radius:8px; padding:10px; font-size:13px;" onchange="changeAutoPlaySpeed(this.value)">
                <option value="600">0.6s</option>
                <option value="1000">1.0s</option>
                <option value="1500">1.5s</option>
                <option value="2500" selected>2.5s (Default)</option>
                <option value="4000">4s</option>
                <option value="6000">6s</option>
            </select>
        </div>

        <div style="margin-bottom: 16px;">
            <button onclick="toggleAutoPlay(); toggleSettingsModal();" id="autoPlayMenuBtn" style="width:100%; background:#1c1c21; color:#38bdf8; border:1px solid #333; padding:12px; border-radius:10px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
                <span id="autoPlayIconMenu">▶️</span> <span id="autoPlayTextMenu">Start Auto-Play</span>
            </button>
        </div>

        <div style="margin-bottom: 16px;">
            <button onclick="manualSyncToGitHub(); toggleSettingsModal();" style="width:100%; background:rgba(56,189,248,0.1); color:#38bdf8; border:1px solid rgba(56,189,248,0.3); padding:12px; border-radius:10px; font-weight:600; cursor:pointer;">
                💾 Sync Data to GitHub
            </button>
        </div>

        <div style="border-top:1px solid #222; padding-top:16px; margin-top:16px;">
            <button onclick="confirmClearData()" style="width:100%; background:rgba(248,113,113,0.15); color:#f87171; border:1px solid rgba(248,113,113,0.3); padding:12px; border-radius:10px; font-weight:600; cursor:pointer;">
                🗑️ Clear Seen & Hearts Data
            </button>
            <div style="font-size:10px; color:#666; text-align:center; margin-top:6px;">Resets progress files on GitHub. Protected behind confirmation.</div>
        </div>
    </div>
</div>

<!-- Login Screen -->
<div id="loginScreen">
    <div id="loginBox">
        <h2 style="margin-top:0; font-size:18px;">GitHub Token Access</h2>
        <input id="passwordInput" type="password" placeholder="ghp_...">
        <button class="login-btn" id="loginButton">Connect</button>
        <div id="loginError" style="color:#f87171; font-size:12px; margin-top:10px;"></div>
    </div>
</div>

<!-- Main App -->
<div id="app">
    <div class="top-bar">
        <div class="brand-title">MEDIA VIEWER</div>
        <div class="mini-stats">
            <div>Seen: <span id="statSeen">0/0</span></div>
            <div>Hearts: <span id="statHearts">0</span></div>
        </div>
    </div>

    <div class="search-wrapper">
        <input id="searchInput" type="text" placeholder="Search number or URL...">
    </div>

    <div id="status" style="color:#f87171; font-size:13px; margin:8px;"></div>

    <div id="mediaContainer"></div>

    <!-- Right-Hand Optimized Thumb Dock -->
    <div class="thumb-dock">
        <button class="dock-btn" onclick="toggleHistoryModal()">
            <span class="icon">🕒</span>
            <span>History</span>
        </button>

        <button class="dock-btn" id="heartModeBtn" onclick="showHeartedOnly()">
            <span class="icon" id="heartModeIcon">♡</span>
            <span>Hearts</span>
        </button>

        <button class="dock-btn" id="swipeModeBtn" onclick="toggleSwipeMode()">
            <span class="icon" id="swipeModeIcon">🎴</span>
            <span>Swipe</span>
        </button>

        <button class="dock-btn" onclick="toggleSettingsModal()">
            <span class="icon">⚙️</span>
            <span>Menu</span>
        </button>

        <!-- Primary Thumb Action Button -->
        <button class="dock-primary" onclick="nextRandomPage()" title="Next / Random">🎲</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
