<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Media Viewer">
<title>Media Viewer</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #e0e0e0;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
}

html {
    scroll-behavior: smooth;
    overscroll-behavior-y: none;
}

body {
    overflow-x: hidden;
    user-select: none;
    -webkit-touch-callout: default;
    -webkit-tap-highlight-color: transparent;
}

body.swipe-mode {
    overflow: hidden;
}

#app {
    display: none;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

h1 {
    margin: 12px 0 8px;
    font-size: 24px;
}

a {
    color: #00aaff;
}

img,
video {
    user-select: auto;
}

/* Login */

#loginScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    padding: 20px;
}

#loginBox {
    width: 100%;
    max-width: 360px;
    padding: 25px;
    background: #1f1f1f;
    border-radius: 12px;
}

#loginBox h2 {
    margin-top: 0;
}

#passwordInput {
    width: 100%;
    padding: 10px;
    border: 0;
    border-radius: 6px;
    outline: 0;
    font-size: 16px;
}

#loginError {
    margin-top: 10px;
    color: #ff4444;
}

/* Search */

#searchInput {
    display: block;
    width: 90%;
    max-width: 450px;
    margin: 5px auto 10px;
    padding: 10px;
    border: 0;
    border-radius: 8px;
    outline: 0;
    font-size: 16px;
}

/* Stats */

.stats-dashboard {
    display: flex;
    width: 90%;
    max-width: 450px;
    margin: 0 auto 12px;
    padding: 10px 5px;
    background: #121212;
    border: 1px solid #222;
    border-radius: 10px;
}

.stat-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.stat-label {
    margin-bottom: 3px;
    color: #888;
    font-size: 10px;
    text-transform: uppercase;
}

.stat-value {
    color: #fff;
    font-size: 13px;
    font-weight: bold;
}

/* Controls */

.controls {
    width: 100%;
    text-align: center;
}

#topControls {
    margin-top: 5px;
}

.mobile-control-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 95%;
    max-width: 520px;
    margin: 0 auto 8px;
}

.control-left {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 4px;
}

.random-control {
    display: flex;
}

.random-btn {
    width: 100%;
    min-height: 86px;
    margin: 0;
    border-radius: 14px;
    background: #8e44ad;
    font-size: 21px;
    font-weight: bold;
}

.random-btn:hover {
    background: #9b59b6;
}

.secondary-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 95%;
    max-width: 520px;
    margin: 0 auto 8px;
}

.secondary-controls button {
    flex: 1 1 auto;
    min-width: 105px;
}

.secondary-controls select {
    padding: 8px 9px;
    border: 1px solid #444;
    border-radius: 7px;
    background: #222;
    color: #fff;
    font-size: 12px;
}

button {
    margin: 3px;
    padding: 9px 14px;
    border: 0;
    border-radius: 7px;
    background: #4caf50;
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    transition: .15s ease;
}

button:hover {
    opacity: .9;
}

button:active {
    transform: scale(.96);
}

.history-btn {
    background: #34495e;
}

.swipe-mode-btn {
    background: #2980b9;
}

.heart-mode-btn {
    background: #e91e63;
}

.sync-btn {
    background: #27ae60;
    font-weight: bold;
}

.autoplay-btn {
    background: #16a085;
    font-weight: bold;
}

/* Status */

#status {
    min-height: 20px;
    margin: 8px 10px;
    color: #ff6666;
    font-size: 14px;
}

/* Media */

#mediaContainer {
    width: 100%;
}

.media-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100vw;
    margin: 0;
    padding: 0 0 15px;
    touch-action: pan-y;
}

.media-container img,
.media-container video {
    display: block;
    width: auto;
    max-width: 100vw;
    max-height: 75vh;
    height: auto;
    background: #000;
    object-fit: contain;
    cursor: pointer;
    touch-action: pan-x pan-y pinch-zoom;
}

.media-number {
    margin: 6px 0 4px;
    opacity: .55;
    font-size: 12px;
}

.media-container > a {
    width: 95%;
    margin: 6px 0 10px;
    font-size: 11px;
    text-decoration: none;
    word-break: break-all;
}

/* Hearts */

.heart-btn {
    margin: 5px 0;
    padding: 0;
    background: transparent;
    color: #fff;
    font-size: 28px;
}

.heart-btn:hover {
    background: transparent;
    transform: scale(1.15);
}

.heart-btn.active {
    color: #ff2d55;
}

.floating-heart {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 50;
    transform: translate(-50%, -50%) scale(0);
    color: #ff2d55;
    font-size: 90px;
    pointer-events: none;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.6));
    animation: popHeart .6s ease-out forwards;
}

@keyframes popHeart {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }

    30% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 1;
    }

    60% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }

    100% {
        transform: translate(-50%, -50%) scale(1.4);
        opacity: 0;
    }
}

/* Seen */

.seen-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 3px 7px;
    border: 1px solid rgba(46,204,113,.45);
    border-radius: 999px;
    background: rgba(46,204,113,.16);
    color: #2ecc71;
    font-size: 10px;
    font-weight: bold;
    vertical-align: middle;
}

/* Swipe mode */

body.swipe-mode #app {
    display: flex !important;
    flex-direction: column;
    height: 100svh;
    min-height: 100svh;
    overflow: hidden;
}

body.swipe-mode h1 {
    flex-shrink: 0;
    margin: 5px 0 2px;
    font-size: 20px;
}

body.swipe-mode #searchInput,
body.swipe-mode #statsDashboard,
body.swipe-mode #topControls,
body.swipe-mode #bottomControls,
body.swipe-mode #status {
    flex-shrink: 0;
}

body.swipe-mode #searchInput {
    margin: 3px auto 5px;
}

body.swipe-mode #statsDashboard {
    margin-bottom: 4px;
}

body.swipe-mode #status {
    min-height: 18px;
    margin: 2px 10px;
}

body.swipe-mode #mediaContainer {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 0;
    overflow: hidden;
}

body.swipe-mode .media-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: 5px 10px;
    overflow: hidden;
}

body.swipe-mode .media-container img,
body.swipe-mode .media-container video {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

body.swipe-mode .media-container > a {
    display: none;
}

body.swipe-mode .media-number {
    position: absolute;
    top: 5px;
    left: 10px;
    right: 10px;
    z-index: 5;
    margin: 0;
    font-size: 11px;
    pointer-events: none;
}

body.swipe-mode .heart-btn {
    position: absolute;
    top: 32px;
    right: 15px;
    z-index: 10;
    margin: 0;
    padding: 4px 8px;
    font-size: 34px;
}

.swipe-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 10px 0 20px;
}

body.swipe-mode .swipe-actions {
    position: absolute;
    right: 10px;
    bottom: 8px;
    left: 10px;
    z-index: 10;
    margin: 0;
}

.swipe-action-btn {
    min-width: 120px;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
}

/* History */

#historyModal {
    position: fixed;
    inset: 0;
    z-index: 9500;
    padding: calc(15px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto;
    background: rgba(0,0,0,.94);
    text-align: left;
}

.history-modal-inner {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}

.history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #333;
}

.history-header h3 {
    margin: 0;
    font-size: 18px;
}

.history-close-btn {
    flex-shrink: 0;
    margin: 0;
    padding: 7px 12px;
    background: #c0392b;
}

.history-item {
    display: flex;
    align-items: center;
    min-height: 70px;
    margin-bottom: 8px;
    padding: 8px;
    border: 1px solid #222;
    border-radius: 10px;
    background: #151515;
    cursor: pointer;
}

.history-item:hover {
    background: #222;
}

.history-thumbnail,
.history-thumbnail-placeholder {
    width: 64px;
    height: 64px;
    flex: 0 0 64px;
    border: 1px solid #333;
    border-radius: 7px;
    background: #000;
    object-fit: cover;
}

.history-thumbnail-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0c0c0c;
    color: #666;
    font-size: 24px;
}

.history-info {
    min-width: 0;
    flex: 1;
    margin-left: 10px;
}

.history-number {
    margin-bottom: 3px;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
}

.history-url {
    color: #777;
    font-size: 10px;
    line-height: 1.3;
    word-break: break-all;
}

.history-heart {
    flex-shrink: 0;
    margin-left: 8px;
    font-size: 18px;
}

/* Footer */

.footer-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: 40px 0 60px;
    padding-top: 20px;
    border-top: 1px solid #222;
}

.clear-btn,
.logout-btn {
    background: transparent;
    border: 1px dashed;
}

.clear-btn {
    border-color: #ff6b6b;
    color: #ff6b6b;
    opacity: .8;
}

.logout-btn {
    border-color: #555;
    color: #888;
}

.clear-btn:hover,
.logout-btn:hover {
    background: rgba(255,255,255,.05);
    opacity: 1;
}

.hidden {
    display: none !important;
}

/* Small phones */

@media (max-width: 380px) {
    h1 {
        font-size: 22px;
    }

    .mobile-control-layout {
        gap: 5px;
    }

    .random-btn {
        min-height: 78px;
        font-size: 18px;
    }

    .control-left button {
        padding: 8px 9px;
        font-size: 11px;
    }

    .stats-dashboard {
        width: 96%;
    }

    .stat-label {
        font-size: 9px;
    }

    .stat-value {
        font-size: 12px;
    }
}

/* Larger screens */

@media (min-width: 700px) {
    .mobile-control-layout,
    .secondary-controls {
        max-width: 650px;
    }

    .random-btn {
        min-height: 95px;
    }

    .history-thumbnail,
    .history-thumbnail-placeholder {
        width: 76px;
        height: 76px;
        flex-basis: 76px;
    }
}
</style>
</head>

<body>

<div id="welcomeBanner">
    ✅ Tracking enabled.<br><br>
    You will not see the same media twice<br>
    on this device.
</div>

<div id="historyModal" class="hidden">
    <div class="history-modal-inner">
        <div class="history-header">
            <h3>🕒 Recently Viewed History</h3>
            <button class="history-close-btn" onclick="toggleHistoryModal()">
                Close ✕
            </button>
        </div>
        <div id="historyListContainer"></div>
    </div>
</div>

<div id="loginScreen">
    <div id="loginBox">
        <h2>Enter Access Token</h2>

        <input
            id="passwordInput"
            type="password"
            placeholder="GitHub Token (ghp_...)"
        >

        <br><br>

        <button id="loginButton">
            Enter
        </button>

        <div id="loginError"></div>
    </div>
</div>

<div id="app">

    <h1>Media Viewer</h1>

    <input
        id="searchInput"
        type="text"
        placeholder="Search by URL or number..."
    >

    <div id="statsDashboard" class="stats-dashboard">

        <div class="stat-item">
            <span class="stat-label">Progress</span>
            <span id="statProgress" class="stat-value">0%</span>
        </div>

        <div class="stat-item">
            <span class="stat-label">Seen</span>
            <span id="statSeen" class="stat-value">0 / 0</span>
        </div>

        <div class="stat-item">
            <span class="stat-label">Hearts</span>
            <span id="statHearts" class="stat-value">0</span>
        </div>

        <div class="stat-item">
            <span class="stat-label">Remaining</span>
            <span id="statRemaining" class="stat-value">0</span>
        </div>

    </div>

    <div id="topControls" class="controls"></div>

    <div id="status"></div>

    <div id="mediaContainer"></div>

    <div id="bottomControls" class="controls"></div>

    <div class="footer-container">

        <button class="clear-btn" onclick="clearAllData()">
            🗑 Clear All History & Hearts
        </button>

        <button class="logout-btn" onclick="logoutGitHub()">
            🔒 Logout / Reset GitHub Token
        </button>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
